name: Verify reproducible Nix image

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  nix-build-a:
    name: Nix image build (environment A)
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - name: Deliberately break reproducibility (temporary evidence)
        run: sed -i 's/1970-01-01T00:00:01Z/1970-01-01T00:00:02Z/' flake.nix

      - name: Build image without Docker
        run: nix build .#docker --print-build-logs

      - name: Record image digest
        id: digest
        run: echo "digest=$(sha256sum result | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  nix-build-b:
    name: Nix image build (environment B)
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17
      - name: Build image without Docker
        run: nix build .#docker --print-build-logs
      - name: Record image digest
        id: digest
        run: echo "digest=$(sha256sum result | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  compare-digests:
    name: Assert equal image digests
    runs-on: ubuntu-24.04
    needs: [nix-build-a, nix-build-b]
    steps:
      - name: Compare fresh-runner image digests
        env:
          DIGEST_A: ${{ needs.nix-build-a.outputs.digest }}
          DIGEST_B: ${{ needs.nix-build-b.outputs.digest }}
        run: |
          printf 'environment A: %s\n' "$DIGEST_A"
          printf 'environment B: %s\n' "$DIGEST_B"
          test -n "$DIGEST_A"
          test "$DIGEST_A" = "$DIGEST_B"
